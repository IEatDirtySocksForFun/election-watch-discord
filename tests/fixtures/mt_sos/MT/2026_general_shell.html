<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Montana</title>
  </head>
  <body>
    <div class="header-box-wrapper">
      <div class="section group">
        <div class="col header-box1">
          <h1>2026</h1>
          <h2>General Election - November 3, 2026</h2>
        </div>
        <!--End Header Box 1-->
        <div class="col header-box2">
          <div class="header-box-content-top">
            <h1>
              <a
                id="lnkVoterTurnout"
                class="button"
                href="VoterTurnoutDetails.aspx?map=TURN&amp;eid=450002987"
                >Statewide Voter Turnout</a
              >
            </h1>
          </div>
          <!--End header-box2-content-top-->
          <div class="header-box-content-bottom">
            <div class="animate-position desktop">
              <div style="height: 150px">
                <canvas
                  id="voter-turnout"
                  voterturnout="0"
                  votertotal="1"
                ></canvas>
                <div class="dough-percent">
                  <span class="int">0</span><span class="dec">.0%</span>
                </div>
              </div>
            </div>
            <!--End Animate Position-->
            <div class="animate-position mobile" style="margin-top: -6px">
              <div>
                <canvas
                  id="voter-turnout-mobile"
                  voterturnout="0"
                  votertotal="1"
                ></canvas>
                <div class="dough-percent">
                  <span class="int">0</span><span class="dec">.0%</span>
                </div>
              </div>
            </div>
            <!--End Animate Position-->
          </div>
          <!--End header-box-content-bottom-->
          <div class="header-box-content-reg">
            <h2>
              Total Turnout <span>0</span><br />Registered Voters
              <span style="color: white">1</span>
            </h2>
          </div>
        </div>
        <!--End Header Box 2-->
        <div class="col header-box3">
          <div class="header-box-content-top">
            <h1>
              <a
                id="lnkPrecinctsReporting"
                class="button"
                href="VoterTurnoutDetails.aspx?map=PREC&amp;eid=450002987"
                >Precincts Reporting</a
              >
            </h1>
          </div>
          <!--End header-box2-content-top-->
          <div class="header-box-content-bottom">
            <div class="animate-position desktop">
              <div style="height: 150px">
                <canvas
                  id="precinct-reported"
                  precinctsreported="0"
                  precinctspartial="0"
                  precinctsnotreported="1"
                ></canvas>
                <div class="dough-percent">
                  <span class="int">0</span><span class="dec">.0%</span>
                </div>
              </div>
            </div>
            <!--End Animate Position-->
            <div class="animate-position mobile">
              <div>
                <canvas
                  id="precinct-reported-mobile"
                  precinctsreported="0"
                  precinctspartial="0"
                  precinctsnotreported="1"
                ></canvas>
                <div class="dough-percent">
                  <span class="int">0</span><span class="dec">.0%</span>
                </div>
              </div>
            </div>
            <!--End Animate Position-->
          </div>
          <!--End header-box-content-bottom-->
          <div class="header-box-content-reg header-box-content-prec">
            <h2>
              <div class="colordisc-yellow"></div>
              Partially <span style="color: #ffff00">0</span><br />
              <div class="colordisc-orange"></div>
              Fully <span>0</span>
            </h2>
          </div>
        </div>
        <div id="chartjs-tooltip"></div>
        <!--End Header Box 3-->
      </div>
      <!--End Section Group-->
    </div>
    <div class="last-updated">
      <div class="last-updated">Results last updated: MT</div>
    </div>
  </body>
</html>
