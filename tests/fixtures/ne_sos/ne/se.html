<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nebraska results fixture (trimmed)</title>
  </head>
  <body>
    <div class="wrapper-inside wrapper-border">
      <div>
        <div class="display-results-box-wrapper">
          <div class="display-results-box-a">
            <h1>For Member of the State Board of Education - District 05</h1>
          </div>
          <div class="wrapper-mobile">
            <div class="section group">
              <div class="col display-results-box-b">
                <div class="col follow-checkbox">
                  <input
                    class="css-checkbox"
                    type="checkbox"
                    onclick="CheckboxChecked(this)"
                    id="chk-138"
                  />
                  <label class="css-label" for="chk-138"
                    >Follow This Contest</label
                  >
                </div>
              </div>
              <div class="display-results-box-g">
                <div class="export-box dropdown">
                  <div class="export dropbtn">Export</div>
                  <div
                    id="export-138"
                    class="dropdown-content export-container"
                  >
                    <div class="export-header">EXPORT:</div>
                    <input
                      onclick="
                        DownloadFile();
                        __doPostBack(
                          'ctl00$MainContent$rptRace$ctl00$ctl00',
                          '',
                        );
                      "
                      name="ctl00$MainContent$rptRace$ctl00$ctl00"
                      type="button"
                      class="export-button"
                      value="Precinct Level"
                      raceid="13213"
                      party=""
                      officeseqno="112"
                      countyid="0"
                    />
                    <input
                      onclick="
                        DownloadFile();
                        __doPostBack(
                          'ctl00$MainContent$rptRace$ctl00$ctl01',
                          '',
                        );
                      "
                      name="ctl00$MainContent$rptRace$ctl00$ctl01"
                      type="button"
                      class="export-button"
                      value="County Level"
                      raceid="13213"
                      party=""
                      officeseqno="112"
                    />
                  </div>
                </div>
                <div class="share-box dropdown">
                  <img
                    class="mtc-icon-inline-position dropbtn"
                    alt=""
                    title="Share"
                    src="Images/my-tracked-contests-icon.png"
                  />
                  <div class="dropdown-content export-container">
                    <div class="share-header">SHARE ON</div>
                    <div class="share-icon-wrapper">
                      <div class="share-buttons">
                        <a
                          href="https://www.facebook.com/sharer/sharer.php?u=http://electionresults.nebraska.gov/SearchResults.aspx?ID=138"
                          target="_blank"
                        >
                          <img
                            alt="Share on Facebook"
                            title="Facebook"
                            src="Images/facebook.png"
                        /></a>
                        <a
                          href="https://twitter.com/intent/tweet?text=http://electionresults.nebraska.gov/SearchResults.aspx?ID=138&hashtags=Vote"
                          target="_blank"
                        >
                          <img
                            alt="Share on Twitter"
                            title="Twitter"
                            src="Images/twitter.png"
                        /></a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col display-results-box-c">
                <div class="precinct-fully">Precincts Fully: 0 / 360</div>
                <div class="precinct-separator">|</div>
                <div class="precinct-partial">Partially: 0 / 360</div>
              </div>
            </div>
          </div>
        </div>

        <div class="section group">
          <div class="col display-results-box-d">
            <h1>Michaela Conway</h1>
            <h2 class="Nonpartisan">Nonpartisan</h2>
          </div>
          <div class="col display-results-box-e">
            <div class="wrapper-mobile">
              <div class="bar-graph-wrap">
                <div id="bar132131122798"></div>
              </div>
            </div>
          </div>
          <div class="col display-results-box-f">
            <h1>0</h1>
          </div>
        </div>
        <hr />

        <div class="section group">
          <div class="col display-results-box-d">
            <h1>Angie Eberspacher</h1>
            <h2 class="Nonpartisan">Nonpartisan</h2>
          </div>
          <div class="col display-results-box-e">
            <div class="wrapper-mobile">
              <div class="bar-graph-wrap">
                <div id="bar132131122829"></div>
              </div>
            </div>
          </div>
          <div class="col display-results-box-f">
            <h1>0</h1>
          </div>
        </div>
        <hr />

        <div class="section group">
          <div class="col display-results-box-totalvotes">
            <h2>total votes</h2>
          </div>
          <div class="col display-results-box-total">
            <h2>0</h2>
          </div>
        </div>
      </div>
      <input
        class="button-maps"
        type="button"
        onclick="
          CreateMap('SE', '13213', '112', '');
          $(this).addClass('active-button');
        "
        value="Map"
      />
      <input
        class="button-county"
        type="button"
        onclick="
          BuildCounty('SE', '13213', '112', '');
          $(this).addClass('active-button');
        "
        value="County Results"
      />
      <div id="Map13213112" style="display: none" class="slidingDiv-maps">
        <div class="section group">
          <div class="col map-col1" id="Mapinfo13213112">
            <div id="countyInfoBox13213"></div>
          </div>
          <div class="col map-col2">
            <h1>Click on County Below</h1>
            <div class="map" id="Mapmap13213112"></div>
          </div>
          <div class="col map-col3">
            <div id="legendInfoBox13213"></div>
          </div>
          <div class="modal"></div>
        </div>
      </div>
      <div
        id="County13213112"
        style="display: none"
        class="slidingDiv-maps"
      ></div>
    </div>
  </body>
</html>
