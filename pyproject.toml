[project]
name = "election-watch-discord"
version = "0.1.0"
description = "Template Discord bot that tracks US election results, race calls, turnout and prediction-market swings"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.4,<3",
  "pymongo>=4.10,<5",       # includes the native asyncio client (AsyncMongoClient)
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "selectolax>=0.3,<1",     # fast HTML parsing for scrape adapters
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
election-watch = "electionwatch.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["electionwatch*"]
