[project]
name = "election-watch-discord"
version = "0.1.0"
description = "Template Discord bot that tracks US election results, race calls, turnout and prediction-market swings"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.4,<3",
  "pymongo>=4.10,<5",       # includes the native asyncio client (AsyncMongoClient)
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "selectolax>=0.3,<1",     # fast HTML parsing for scrape adapters
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff==0.6.9"]

[project.scripts]
election-watch = "electionwatch.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["electionwatch*"]

[tool.setuptools.package-data]
electionwatch = ["data/certs/*.pem", "data/certs/README.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures", "replay/out"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import sorting.
select = ["E", "F", "W", "I"]
# The formatter takes care of line length; long strings and URLs are left alone.
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
]
