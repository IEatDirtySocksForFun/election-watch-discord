# Canonical party table: codes, names, buckets and Discord emoji markers.
#
# Loaded by electionwatch/parties.py (never edited at runtime). Names and ideologies come from
# Wikipedia's "List of political parties in the United States" and the individual party articles
# cited in `source` (checked 2026-10); the Constitution Party's state affiliates and the
# Libertarian/Green state parties with their own ballot line are aliases of the national code,
# except where a state party has its own registered name (Maine Green Independent, Green-Rainbow,
# Mountain, Pacific Green, American Independent, Utah Independent American).
#
# Fields
#   code     canonical short code; what adapters should store in CandidateResult.party
#   name     official name
#   bucket   dem | rep | libertarian | green | socialist | far_right | constitution |
#            independent | centrist | other
#   emoji    the marker shown next to a candidate; DEM 🔵, REP 🔴, Libertarian 🟡,
#            Green 🟢, Constitution 📜, independent/no party ⚪; socialist parties get a
#            distinct emoji in order of size; far_right (neo-Nazi / white nationalist / fascist
#            only, per `source`) gets its own; every other party a fitting distinct one.
#   aliases  every spelling/abbreviation seen in election feeds; matched case- and
#            punctuation-insensitively
#   source   URL backing the name and ideology/bucket
#
# far_right is deliberately narrow: mainstream conservative and right-populist third parties
# (Conservative Party of New York, New Jersey Conservative, Tea Party of Nevada) are "other".
parties:
