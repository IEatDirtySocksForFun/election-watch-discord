# Per-state election FAQ for the Nov 3, 2026 general election.
# Keyed by USPS code. Text fields render in a Discord embed (<= 1024 chars).
# Mail deadlines/processing rules: NCSL VOPP Tables 11 and 16 (accessed Oct 2026).
# Recount thresholds: NCSL "Election Recounts". Poll closings: 270toWin poll-closing-times.
# Where a field could not be verified from an official source it is null and
# listed under "unverified".
AL:
  official_results_url: https://www.sos.alabama.gov/alabama-votes/voter/enr-current-list
  sos_url: https://www.sos.alabama.gov/
  results_vendor: null
  polls_close_local: "7:00 PM"
  timezones: [America/Chicago]
  count_order: >-
    Election-day precincts report first; absentee ballots are opened from 7 a.m.
    and counted after polls close, so mail lands late in the night.
  mail_deadline: >-
    Must be received by noon on Election Day; postmarks do not extend the deadline.
  mail_processing: >-
    No processing before 7 a.m. on Election Day; ballots are scanned only after
    the polls close.
  typical_call_time: >-
    Fast to hours: small precinct counts report quickly, but a close race may
    wait for absentee and provisional ballots counted after the polls close.
  recount_threshold: Automatic recount if margin is less than 0.5% of votes cast.
  ranked_choice: "false"
  notes: >-
    Absentee is excuse-required and relatively light; most of the vote is
    counted in the first few hours after 7 p.m. CT.
  sources:
    - https://www.sos.alabama.gov/alabama-votes/voter/enr-current-list
    - https://www.sos.alabama.gov/
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
AK:
  official_results_url: https://www.elections.alaska.gov/results/
  sos_url: https://www.elections.alaska.gov/
  results_vendor: null
  polls_close_local: "8:00 PM"
  timezones: [America/Anchorage, America/Adak]
  polls_close_note: >-
    Most of the state closes at 8 p.m. Alaska time; the Aleutians close an hour
    later (1 a.m. ET).
  count_order: >-
    Absentee and early votes (processed from seven days before) report first at
    8 p.m.; election-day precincts follow, then questioned ballots.
  mail_deadline: >-
    Postmarked on or before Election Day and received within 10 days (Nov 13).
  mail_processing: >-
    Envelope verification starts seven days before Election Day; ballots are
    scanned after 8 p.m. on Election Day.
  typical_call_time: >-
    Days: first-choice results arrive on election night, but statewide races use
    ranked-choice voting and the rounds are not run until Nov 18, after the
    overseas absentee window closes.
  recount_threshold: >-
    Automatic recount only for a tie vote; otherwise a candidate or 10 voters
    may request one.
  ranked_choice: Statewide RCV for general elections (top-four primary).
  notes: >-
    RCV tabulation is the big delay: first choices on election night, final
    rounds on Nov 18 after the last overseas absentee ballots arrive.
  sources:
    - https://www.elections.alaska.gov/results/
    - https://www.elections.alaska.gov/
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.ncsl.org/elections-and-campaigns/ranked-choice-voting
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
AZ:
  official_results_url: https://results.arizona.vote/
  sos_url: https://azsos.gov/elections
  results_vendor: null
  polls_close_local: "7:00 PM"
  timezones: [America/Phoenix]
  count_order: >-
    Early ballots (mail plus in-person early) are released first at 7 p.m.;
    election-day precincts follow; late early-ballot drop-offs are counted over
    the following days.
  mail_deadline: >-
    Must be received by 7 p.m. on Election Day; postmarks do not count.
  mail_processing: >-
    Signature verification and envelope processing begin on receipt; ballots may
    be scanned immediately and results released after polls close.
  typical_call_time: >-
    Days: Maricopa and other large counties drop late early ballots on election
    day and take days to verify and count them, so close statewide races often
    are not called for several days.
  recount_threshold: >-
    Automatic recount if the margin is 0.5% or less of votes cast for both
    candidates (or on a measure).
  ranked_choice: "false"
  notes: >-
    Maricopa late-earlies dropped off on E-day take days; the 2022 and 2024
    counts were called only after those batches were processed.
  sources:
    - https://results.arizona.vote/
    - https://azsos.gov/elections
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
AR:
  official_results_url: https://arkansas.tally-enr.com/
  sos_url: https://www.sos.arkansas.gov/elections
  results_vendor: Tally ENR
  polls_close_local: "7:30 PM"
  timezones: [America/Chicago]
  count_order: >-
    Election-day precincts report first; absentee ballots are opened from 8:30
    a.m. and counted during the day, then reported after the precincts.
  mail_deadline: >-
    Must be received by 7:30 p.m. on Election Day; hand-delivered ballots are
    due by close of business the Friday before.
  mail_processing: >-
    Envelope processing may start the Tuesday before Election Day; ballots are
    scanned from 8:30 a.m. on Election Day.
  typical_call_time: >-
    Fast: a small state with quick precinct reporting; absentee is counted
    during election day and rarely changes a clear result.
  recount_threshold: >-
    No automatic recount; a candidate may petition for one (cost bond required).
  ranked_choice: "false"
  notes: >-
    Arkansas moved to a new election-night reporting vendor (Tally ENR) for
    2026; the statewide site carries all county returns.
  sources:
    - https://arkansas.tally-enr.com/
    - https://www.sos.arkansas.gov/elections
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
CA:
  official_results_url: https://electionresults.sos.ca.gov/
  sos_url: https://www.sos.ca.gov/elections
  results_vendor: null
  polls_close_local: "8:00 PM"
  timezones: [America/Los_Angeles]
  count_order: >-
    Mail and early ballots counted before Election Day are released first at
    8 p.m.; election-day precincts follow; late mail, provisional and cured
    ballots are added in the following days and weeks.
  mail_deadline: >-
    Postmarked on or before Election Day and received within seven days (Nov 10).
  mail_processing: >-
    Processing (signature check, opening, scanning) may begin when ballots are
    mailed, up to 29 days before Election Day.
  typical_call_time: >-
    Days: late mail is accepted for a week and large counties count in batches,
    so close statewide and House races often take days to resolve.
  recount_threshold: >-
    No automatic recount; a voter or campaign may request one within five days
    and pay the cost.
  ranked_choice: Local only (San Francisco, Oakland, Berkeley and other cities).
  notes: >-
    California is effectively a mail election: most ballots are in before
    Election Day, but late-arriving mail keeps close races open for a week.
  sources:
    - https://electionresults.sos.ca.gov/
    - https://www.sos.ca.gov/elections
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.ncsl.org/elections-and-campaigns/ranked-choice-voting
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
CO:
  official_results_url: https://results.enr.clarityelections.com/CO/
  sos_url: https://www.coloradosos.gov/pubs/elections/
  results_vendor: Clarity Elections (Scytl)
  polls_close_local: "7:00 PM"
  timezones: [America/Denver]
  count_order: >-
    Mail ballots, processed as they arrive, dominate the first release at 7 p.m.;
    election-day precincts and late drop-offs follow.
  mail_deadline: >-
    Must be received by 7 p.m. on Election Day; postmarks do not count.
  mail_processing: >-
    Envelopes are verified on receipt; ballots may be scanned from 15 days before
    Election Day (required by four days out in large counties).
  typical_call_time: >-
    Hours: most ballots are already processed when polls close, so statewide
    races are usually called overnight; a very close race may wait for late
    drop-offs.
  recount_threshold: >-
    Automatic recount if the margin is 0.5% or less of the highest vote cast;
    completed by the 31st day after the election.
  ranked_choice: Local only (Boulder, Denver and other municipalities).
  notes: >-
    Colorado is all-mail; the first 7 p.m. release is large and later batches
    are mostly drop-box ballots delivered on Election Day.
  sources:
    - https://results.enr.clarityelections.com/CO/
    - https://www.coloradosos.gov/pubs/elections/
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.ncsl.org/elections-and-campaigns/ranked-choice-voting
    - https://www.270towin.com/poll-closing-times/
CT:
  official_results_url: https://portal.ct.gov/sots/election-services/election-results/election-results
  sos_url: https://portal.ct.gov/sots/election-services/election-services
  results_vendor: null
  polls_close_local: "8:00 PM"
  timezones: [America/New_York]
  count_order: >-
    Election-day precincts report first after 8 p.m.; absentee ballots are
    delivered to polling places or central counts during the day and tallied
    after the polls close.
  mail_deadline: >-
    Must be received by the close of polls on Election Day; postmarks do not
    extend the deadline.
  mail_processing: >-
    Sorting and envelope checks may start the day after absentee sets are issued
    (about three to four weeks out); ballots are scanned from 8 a.m. on Election
    Day.
  typical_call_time: >-
    Fast to hours: towns report quickly and the state is small; a close race can
    wait for absentee and same-day registration ballots counted after 8 p.m.
  recount_threshold: >-
    Automatic recount if margin is less than 0.5% (capped at 2,000 votes) or
    fewer than 20 votes.
  ranked_choice: "false"
  notes: >-
    Same-day voter registration can add a late batch at polling places, but
    Connecticut counts it on election night.
  sources:
    - https://portal.ct.gov/sots/election-services/election-results/election-results
    - https://portal.ct.gov/sots/election-services/election-services
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
DE:
  official_results_url: https://elections.delaware.gov/results/
  sos_url: https://elections.delaware.gov/
  results_vendor: null
  polls_close_local: "8:00 PM"
  timezones: [America/New_York]
  count_order: >-
    Mail and early ballots, processed from 30 days out, are released first at
    8 p.m.; election-day precincts follow and are usually complete quickly.
  mail_deadline: >-
    Must be received by the close of polls on Election Day.
  mail_processing: >-
    Envelopes are verified and ballots scanned beginning 30 days before
    Election Day, with results held until polls close.
  typical_call_time: >-
    Fast: a small state with few counties; statewide races are usually clear
    within a couple of hours of the 8 p.m. close.
  recount_threshold: >-
    Automatic recount for state legislative and county races if margin is under
    1,000 votes or 0.5%, whichever is less.
  ranked_choice: "false"
  notes: >-
    Delaware has no statewide automatic recount for its federal or statewide
    offices; a candidate-requested recount is the route.
  sources:
    - https://elections.delaware.gov/results/
    - https://elections.delaware.gov/
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]
