  sos_url: https://elections.hawaii.gov/
  results_vendor: null
  polls_close_local: "7:00 PM"
  timezones: [Pacific/Honolulu]
  count_order: >-
    All-mail state: ballots verified and scanned from 18 days out are released
    first at 7 p.m. HST; election-day drop-offs and later mail follow.
  mail_deadline: >-
