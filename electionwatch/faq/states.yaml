FL:
  official_results_url: https://results.elections.myflorida.com/
  sos_url: https://dos.fl.gov/elections/
  results_vendor: null
  polls_close_local: "7:00 PM"
  timezones: [America/New_York, America/Chicago]
  polls_close_note: >-
    Most of the state closes at 7 p.m. ET; the western panhandle closes at 7 p.m.
    CT (8 p.m. ET). Districts 1 and 2 close with the panhandle.
  count_order: >-
    Early in-person and mail ballots, canvassed before Election Day, report first
    at 7 p.m. local; election-day precincts follow; provisionals last.
  mail_deadline: >-
    Must be received by 7 p.m. on Election Day; postmarks do not count.
  mail_processing: >-
    Signature verification starts on receipt; ballots may be scanned once
    tabulation equipment is publicly tested, up to 25 days before early voting.
  typical_call_time: >-
    Fast to hours: Florida counts early and mail before election night and
    reports county by county; most races are clear within hours, with close
    races waiting on the panhandle's later close.
  recount_threshold: >-
    Automatic machine recount if margin is 0.5% or less; a manual recount
    follows if 0.25% or less.
  ranked_choice: "false"
  notes: >-
    Panhandle counties close an hour after the rest of the state, so the last
    Florida polls close at 8 p.m. ET.
  sources:
    - https://results.elections.myflorida.com/
    - https://dos.fl.gov/elections/
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
    - https://www.ncsl.org/elections-and-campaigns/table-16-when-absentee-mail-ballot-processing-and-counting-can-begin
    - https://www.ncsl.org/elections-and-campaigns/election-recounts
    - https://www.270towin.com/poll-closing-times/
  unverified: [results_vendor]

GA:
  official_results_url: https://results.enr.clarityelections.com/GA/
  sos_url: https://sos.ga.gov/elections
  results_vendor: Clarity Elections (Scytl)
  polls_close_local: "7:00 PM"
  timezones: [America/New_York]
  count_order: >-
    Early in-person and mail ballots are tabulated from the third Monday before
    and released first at 7 p.m.; election-day precincts follow.
  mail_deadline: >-
    Must be received by the close of polls on Election Day; postmarks do not
    extend the deadline.
  mail_processing: >-
    ID and envelope checks begin on receipt; processing and scanning may start
    the third Monday before Election Day, with results held until polls close.
  typical_call_time: >-
    Hours: pre-counted early and mail votes give a fast first read; most races
    are called overnight, with very close races waiting on election-day
    precincts and provisionals.
  recount_threshold: >-
    Automatic recount if margin is 0.5% or less of total votes cast; completed
    within 17 days of the order.
  ranked_choice: "false"
  notes: >-
    Georgia's early-vote head start means the first 7 p.m. numbers can look very
    different from the final election-day tally.
  sources:
    - https://results.enr.clarityelections.com/GA/
    - https://sos.ga.gov/elections
    - https://www.ncsl.org/elections-and-campaigns/table-11-receipt-and-postmark-deadlines-for-absentee-mail-ballots
