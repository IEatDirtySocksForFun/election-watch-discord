name: Lint

# Ruff for the Python code, Prettier for the Markdown. Both only check here; run them locally
# to fix things:
#   pip install -e .[dev] && ruff check --fix . && ruff format .
#   npx prettier@3.3.3 --write "**/*.md"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes prettier@3.3.3 --check "**/*.md"
