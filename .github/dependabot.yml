# Weekly update PRs for the Python dependencies and the GitHub Actions the workflows use.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # selectolax 1.x drops the parser backend the scrape adapters use; port them first.
      - dependency-name: selectolax
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
